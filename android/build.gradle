buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 28
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "28.0.13004108"
        kotlinVersion = "2.2.0"
    }
    subprojects { subproject ->
        afterEvaluate {
            if ((subproject.plugins.hasPlugin('com.android.application') || 
                 subproject.plugins.hasPlugin('com.android.library'))) {
                android {
                    compileSdkVersion rootProject.ext.compileSdkVersion
                    buildToolsVersion rootProject.ext.buildToolsVersion
                    ndkVersion rootProject.ext.ndkVersion
                    // AGP 9 (RN 0.87+) stopped generating BuildConfig unless a
                    // module opts in, and removed the
                    // android.defaults.buildfeatures.buildconfig property that
                    // used to turn it on globally. Several react-native
                    // libraries reference their own BuildConfig.DEBUG, so
                    // re-enable it for every Android subproject rather than
                    // patching each package.
                    buildFeatures {
                        buildConfig true
                    }
                }
            }
        }
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.protobuf:protobuf-gradle-plugin:0.9.4")

        // LN address notifications
        classpath("com.google.gms:google-services:4.3.15")
    }
}

allprojects {
    // op-sqlite's SQLCipher build depends on io.github.ronickg:openssl:3.3.2-1
    // (OpenSSL 3.3, out of support since 2026-04, published by one person).
    // Use our own reproducible OpenSSL 3.6.2 build instead, matching iOS's
    // OpenSSL-Universal 3.6.2. ZeusLN/openssl-android builds it;
    // fetch-libraries.sh downloads it into android/openssl and checks it
    // against fetch-libraries-versions.json. Keep the version here, the POM
    // under android/openssl and fetch-libraries-versions.json in step.
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute module('io.github.ronickg:openssl') using module('app.zeusln.thirdparty:openssl:3.6.2-zeus1')
        }
    }
    repositories {
        maven {
            url "$rootDir/openssl"
            content { includeGroup 'app.zeusln.thirdparty' }
        }
        google()
        mavenCentral()
        flatDir {
            dirs("lndmobile")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
