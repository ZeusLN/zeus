version: 2
updates:
  # npm dependencies (root manifest)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    # Bundle routine minor/patch bumps into a single PR to keep noise down
    # in a large dependency tree; major bumps still get their own PRs so
    # native / crypto-sensitive upgrades can be reviewed and tested in
    # isolation.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # pod-install 1.x switches to `bundle exec pod` whenever the Gemfile
      # lists cocoapods. When `bundle` is macOS's Ruby 2.6 and `pod` comes
      # from Homebrew (Xcode Cloud, most dev Macs), its first probe writes a
      # Gemfile.lock stamped with Homebrew Ruby's Bundler and the next
      # `bundle` call fails on it, breaking `yarn install`. Dependabot
      # treats 0.1 -> 0.3 as a minor update, so ignore every version and
      # bump pod-install by hand after checking Xcode Cloud.
      - dependency-name: "pod-install"
      # readable-stream stays on 1.x: the rn-nodeify `_stream_*` aliases in
      # package.json point at `readable-stream/transform`, `/readable`,
      # `/writable`, `/duplex` and `/passthrough`. 3.x drops all but
      # readable.js from the package root and 4.x ships only lib/, so Metro
      # fails to resolve them while Jest and tsc stay green.
      - dependency-name: "readable-stream"
        update-types: ["version-update:semver-major"]
      # slider 5.2.2 adds a pan recognizer to every iOS slider: a drag that
      # starts on the track now moves the value (e.g. the NWC budget) and
      # no longer scrolls the parent ScrollView, and a drag from the thumb
      # fires onSlidingComplete twice.
      - dependency-name: "@react-native-community/slider"
        versions: ["5.2.2"]

  # GitHub Actions used by the CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
