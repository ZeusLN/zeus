name: Coverage Comment
on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed
permissions:
  actions: read
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage summary
        uses: actions/download-artifact@v8
        with:
          name: coverage-summary
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Post or update coverage comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            // Artifact contents come from an untrusted PR run: parse as
            // data only, and validate before acting on them.
            const prNumber = parseInt(
                fs.readFileSync('PR_NUMBER', 'utf8').trim(),
                10
            );
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
                core.setFailed('Invalid PR number in artifact');
                return;
            }

            const run = context.payload.workflow_run;
            const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
            });
            if (pr.head.sha !== run.head_sha) {
                core.info(
                    `PR #${prNumber} head ${pr.head.sha} does not match ` +
                        `run head ${run.head_sha}; skipping (stale or mismatched run)`
                );
                return;
            }

            const summary = JSON.parse(
                fs.readFileSync('coverage-summary.json', 'utf8')
            );
            const total = summary.total;
            const row = (label, key) => {
                const m = total[key];
                const pct = typeof m.pct === 'number' ? `${m.pct}%` : m.pct;
                return `| ${label} | ${pct} | ${m.covered}/${m.total} |`;
            };

            const marker = '<!-- jest-coverage-summary -->';
            const body = [
                marker,
                '## Test coverage',
                '',
                '| Metric | Coverage | Covered/Total |',
                '| --- | --- | --- |',
                row('Statements', 'statements'),
                row('Branches', 'branches'),
                row('Functions', 'functions'),
                row('Lines', 'lines'),
                '',
                `Commit: ${run.head_sha} | [Test run](${run.html_url})`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100
            });
            const existing = comments.find(
                (c) =>
                    c.user.login === 'github-actions[bot]' &&
                    c.body.includes(marker)
            );
            if (existing) {
                await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body
                });
            } else {
                await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body
                });
            }
